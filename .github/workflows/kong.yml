name: Kong

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  kong:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      DATABASE_BASE_URL: postgresql://postgres:postgres@postgres:5432
      MONGO_USERNAME: mongo
      MONGO_PASSWORD: mongo
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: audit_log
      AUTH_JWT_ALGORITHM: HS256
      AUTH_JWT_SECRET: ci-test-secret
      AUTH_JWT_AUDIENCE: ""
      REDIS_PASSWORD: redis
      KONG_RATE_LIMIT_PER_MINUTE: 5
      KONG_RATE_LIMIT_PER_HOUR: 1000
      JWT_ISS: https://auth.example.com
      KONG_ADMIN_PORT: 8001
      KONG_PROXY_PORT: 8000
    steps:
      - uses: actions/checkout@v7

      - name: Start Kong
        run: docker compose up -d --quiet-pull kong

      - name: Wait for Kong to be healthy
        run: |
          chmod +x ./docker/kong/wait-healthy.sh
          ./docker/kong/wait-healthy.sh

      - name: Test protected route returns 401 without JWT
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/identity)
          [ "$STATUS" = "401" ] || (echo "Expected 401, got $STATUS" && exit 1)

      - name: Test protected route with valid JWT is forwarded (not 401)
        run: |
          pip install -q "PyJWT[crypto]"
          TOKEN=$(python3 -c "import jwt, time; print(jwt.encode({'iss': 'https://auth.example.com', 'exp': int(time.time()) + 300}, 'ci-test-secret', algorithm='HS256'))")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" http://localhost:8000/api/v1/identity)
          [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ] || (echo "Expected forwarded request, got $STATUS" && exit 1)

      - name: Test public route returns non-401 without JWT
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/catalog)
          [ "$STATUS" != "401" ] || (echo "Expected non-401, got $STATUS" && exit 1)

      - name: Test rate limiting returns 429 after exceeding limit
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/catalog)
            echo "Request $i: $STATUS"
          done
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/catalog)
          [ "$STATUS" = "429" ] || (echo "Expected 429, got $STATUS" && exit 1)

      - name: Test CORS unlisted origin is not echoed back
        run: |
          HEADER=$(curl -s -I -H "Origin: https://evil.com" http://localhost:8000/api/v1/catalog | grep -i "access-control-allow-origin" || true)
          echo "CORS header: $HEADER"
          echo "$HEADER" | grep -v "evil.com" || (echo "Evil origin was echoed back: $HEADER" && exit 1)

      - name: Dump Kong logs on failure
        if: failure()
        run: docker compose logs kong
