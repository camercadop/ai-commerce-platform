x-domain-env: &domain-env
  DATABASE_BASE_URL: ${DATABASE_BASE_URL}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
  AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM}
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
  MONGO_USERNAME: ${MONGO_USERNAME}
  MONGO_PASSWORD: ${MONGO_PASSWORD}
  MONGO_HOST: mongodb
  MONGO_PORT: 27017
  MONGO_DATABASE: ${MONGO_DATABASE}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./app:/app:ro

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  identity:
    build:
      context: .
      args:
        DOMAIN: identity
    environment:
      <<: *domain-env
    depends_on:
      - postgres
      - mongodb

  catalog:
    build:
      context: .
      args:
        DOMAIN: catalog
    environment:
      <<: *domain-env
    depends_on:
      - postgres
      - mongodb

  cart:
    build:
      context: .
      args:
        DOMAIN: cart
    environment:
      <<: *domain-env
    depends_on:
      - postgres
      - mongodb

  orders:
    build:
      context: .
      args:
        DOMAIN: orders
    environment:
      <<: *domain-env
    depends_on:
      - postgres
      - mongodb

  inventory:
    build:
      context: .
      args:
        DOMAIN: inventory
    environment:
      <<: *domain-env
    depends_on:
      - postgres
      - mongodb

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://kafka:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  kong:
    image: kong:3.9
    user: root
    depends_on:
      - identity
      - catalog
      - cart
      - orders
      - inventory
      - redis
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_PORT: ${KONG_PROXY_PORT}
      KONG_ADMIN_PORT: ${KONG_ADMIN_PORT}
      KONG_RATE_LIMIT_PER_MINUTE: ${KONG_RATE_LIMIT_PER_MINUTE}
      KONG_RATE_LIMIT_PER_HOUR: ${KONG_RATE_LIMIT_PER_HOUR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ISS: ${JWT_ISS}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM}
    ports:
      - "${KONG_PROXY_PORT}:8000"
      - "${KONG_ADMIN_PORT}:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./kong:/kong
      - ./docker/kong/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/entrypoint.sh"]

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:
