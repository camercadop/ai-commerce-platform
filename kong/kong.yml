plugins:
  - name: cors
    config:
      origins:
        - https://allowed.example.com
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      exposed_headers: []
      credentials: false
      preflight_continue: false
