[project]
name = "ai-commerce-platform"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.2",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "PyJWT[crypto]>=2.10.0",
    "uvicorn>=0.30.0",
    "pymongo>=4.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "httpx2>=0.28.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "pip-audit>=2.9.0",
    "pre-commit>=4.6.2",
    "psycopg2-binary>=2.9.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["**/tests/**", "**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = [".*tests/", ".*migrations/"]

[tool.pytest.ini_options]
testpaths = ["app"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
omit = ["*/tests/*", "*/migrations/*"]
